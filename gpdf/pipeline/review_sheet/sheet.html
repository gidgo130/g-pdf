<!doctype html>
<!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
<!-- g-pdf review sheet. Self-contained: no network. Written by the gpdf-cli split dry run. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<style>
{{css}}
</style>
</head>
<body>
<header id="top">
  <div class="row">
    <strong id="file-name"></strong>
    <span id="progress" class="pill"></span>
    <span class="filters" role="group" aria-label="Show">
      <button type="button" data-filter="all">All</button>
      <button type="button" data-filter="flagged">Flagged</button>
      <button type="button" data-filter="changed">Changed</button>
    </span>
    <span class="spacer"></span>
    <button type="button" id="save" class="primary">Save decisions</button>
    <button type="button" id="load">Load decisions...</button>
    <input type="file" id="load-input" accept=".json,application/json" hidden>
  </div>
  <div class="row next">
    <span class="label">Next step:</span>
    <input type="text" id="command" readonly aria-label="Command to run next">
    <button type="button" id="copy">Copy</button>
    <span id="command-note" class="muted"></span>
  </div>
  <div id="restore" class="banner" hidden>
    <span id="restore-text"></span>
    <button type="button" id="restore-yes">Restore</button>
    <button type="button" id="restore-no">Discard</button>
  </div>
  <div id="msg" role="status" aria-live="polite"></div>
</header>

<main>
  <section id="review" aria-label="Review">
    <div class="view">
      <div class="frame" id="main-frame">
        <img id="main-img" alt="">
        <svg class="overlay" id="main-svg" aria-hidden="true">
          <line class="detected"></line>
          <line class="current"></line>
        </svg>
        <div class="handle top" data-end="0" title="Drag: move the top of the cut (Shift: whole line)"></div>
        <div class="handle bottom" data-end="1" title="Drag: move the bottom of the cut (Shift: whole line)"></div>
      </div>
      <div class="caption" id="main-caption"></div>
    </div>
    <div class="closeup" id="closeup">
      <div class="frame" id="close-frame">
        <img id="close-img" alt="Gutter close-up">
        <svg class="overlay" id="close-svg" aria-hidden="true">
          <line class="detected"></line>
          <line class="current"></line>
        </svg>
        <div class="handle top" data-end="0" title="Drag: move the top of the cut (Shift: whole line)"></div>
        <div class="handle bottom" data-end="1" title="Drag: move the bottom of the cut (Shift: whole line)"></div>
      </div>
    </div>
    <aside class="panel">
      <h2 id="page-title"></h2>
      <dl id="facts"></dl>
      <p id="slant-warning" class="warn" hidden></p>
      <p id="unsplittable" class="warn" hidden>This page cannot be split by g-pdf: keep it whole.</p>
      <ul id="reasons"></ul>
      <div class="actions">
        <button type="button" id="act-split"><kbd>S</kbd> Split</button>
        <button type="button" id="act-keep"><kbd>K</kbd> Keep whole</button>
        <button type="button" id="act-accept"><kbd>Enter</kbd> Accept as shown</button>
        <button type="button" id="act-reset"><kbd>R</kbd> Reset cut</button>
      </div>
      <div class="actions nav">
        <button type="button" id="prev"><kbd>&larr;</kbd> Previous</button>
        <button type="button" id="next">Next <kbd>&rarr;</kbd></button>
      </div>
      <p class="muted small">Drag the round handles to move the cut; Shift-drag moves the whole
        line. The dashed line is the detector's cut.</p>
    </aside>
  </section>

  <section id="sheet" aria-label="All pages">
    <h2>Pages <span class="legend"><span class="badge amber">flagged</span>
      <span class="badge green">reviewed</span> <span class="badge blue">changed</span>
      <span class="badge grey">single</span> <span class="badge grey">kept whole</span></span></h2>
    <div id="tiles"></div>
  </section>
</main>

<script type="application/json" id="gpdf-data">{{data}}</script>
<script>
{{js}}
</script>
</body>
</html>
