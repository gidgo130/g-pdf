name: tests

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -e ".[dev,prep]"
      - run: python -m pytest -q -rs

  linux-real-input:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: X11, xdotool and Qt's xcb libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool libxcb-cursor0 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-xfixes0 libxcb-shape0 libegl1 libgl1 libfontconfig1 libdbus-1-3 libpulse0
      - run: python -m pip install -e ".[dev,prep]"
      - name: Headless suite
        run: python -m pytest -q -rs
      - name: Real mouse/keyboard drags (Xvfb)
        env:
          QT_QPA_PLATFORM: xcb
          GPDF_REALINPUT: "1"
        run: xvfb-run -a -s "-screen 0 1600x1000x24" python -m pytest tests/realinput -v
