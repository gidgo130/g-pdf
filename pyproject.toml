[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "g-pdf"
version = "0.2.0"
description = "A lean, local PDF workstation: fast page manipulation, read-aloud, and light editing."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "PySide6>=6.6",
    "PyMuPDF>=1.24.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
g-pdf = "gpdf.__main__:main"

[tool.setuptools.packages.find]
include = ["gpdf*"]

[tool.setuptools.package-data]
gpdf = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
