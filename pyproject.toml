[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "g-pdf"
version = "0.2.0"
description = "A lean, local PDF workstation: fast page manipulation, read-aloud, and light editing."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "PySide6>=6.6",
    "PyMuPDF>=1.24.3,<2",  # 2.x bundles onnxruntime + ML layout models (~130 MB)
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Book prep (gpdf-cli split/ocr/survey): pixel work on scanned pages; word lists for the
# survey's text-quality score.
prep = ["numpy>=1.26", "Pillow>=10.3", "wordfreq>=3.1,<4"]

[project.scripts]
g-pdf = "gpdf.__main__:main"
gpdf-cli = "gpdf.cli:main"

[tool.setuptools.packages.find]
include = ["gpdf*"]

[tool.setuptools.package-data]
gpdf = ["assets/*", "pipeline/review_sheet/*", "pipeline/catalogue_sheet/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
